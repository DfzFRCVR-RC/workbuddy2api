name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt

      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must match desktop/version.json ($version)"
          }
          Write-Host "Tag and version.json agree: $version"

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop-lock.txt

      # 维护者的 tests/ 目录不随源码发布（见 README），因此这里不做单元测试，
      # 改为构建后的产物与版本号一致性核验。
      - name: Build desktop executable
        run: python scripts/build_desktop.py

      - name: Verify build output
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          $exe = "dist/WorkBuddy2API-$version-windows-x64.exe"
          $sum = "$exe.sha256"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not (Test-Path $sum)) { throw "Missing $sum" }
          $expected = ((Get-Content $sum) -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "SHA256 mismatch: $expected vs $actual" }
          Write-Host "OK: $exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: dist

      - name: Resolve release notes
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES"
          else
            echo "No $NOTES, will generate notes automatically"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
