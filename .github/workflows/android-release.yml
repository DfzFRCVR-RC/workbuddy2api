name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Android SDK command line tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses and install platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Restore signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING_JSON }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_SIGNING_JSON" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 或 ANDROID_SIGNING_JSON secret。"
            echo "::error::必须使用固定签名，否则每次构建证书不同，用户升级需卸载重装。"
            exit 1
          fi
          mkdir -p build/android-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/android-signing/release.jks
          printf '%s' "$ANDROID_SIGNING_JSON" > build/android-signing/signing.json
          chmod 600 build/android-signing/release.jks build/android-signing/signing.json
          # 指纹固定性自检：证书不一致会在后续签名阶段暴露，这里先打印供审计
          keytool -list -v -keystore build/android-signing/release.jks \
            -storepass "$(python3 -c "import json;print(json.load(open('build/android-signing/signing.json'))['password'])")" \
            2>/dev/null | grep -E 'SHA256:|Alias name' | head -2

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop-lock.txt

      - name: Build release APK
        run: |
          python scripts/build_android.py \
            --gradle "$HOME/gradle-8.11.1/bin/gradle" \
            --jdk "$JAVA_HOME" \
            --sdk "$ANDROID_HOME"

      - name: Verify build output
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('desktop/version.json'))['version'])")
          APK="dist/android/WorkBuddy2API-$VERSION-android-arm64.apk"
          SUM="$APK.sha256"
          [ -f "$APK" ] || { echo "::error::缺少 $APK"; exit 1; }
          [ -f "$SUM" ] || { echo "::error::缺少 $SUM"; exit 1; }
          EXPECTED=$(awk '{print $1}' "$SUM")
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::SHA256 不一致"; exit 1; }
          echo "OK: $APK"
          ls -lh dist/android
          # 校验 APK 签名证书与 keystore 一致
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'SHA-256 digest' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-android-arm64
          path: |
            dist/android/*.apk
            dist/android/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WorkBuddy2API-android-arm64
          path: dist

      - name: Upload APK to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber || {
            echo "::warning::Release $TAG 尚不存在或无法上传，跳过。Windows 工作流会创建 Release。"
          }
